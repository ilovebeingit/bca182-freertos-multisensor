[platformio]
; `pio run` builds only the firmware; the native env is for `pio test -e native`.
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
; freertos_port_patch (lib/) replaces the library's ARM_CM3 port.c with a copy
; carrying the Wokwi PRIMASK/FAULTMASK workaround; see docs/dev-log.md. It is
; listed explicitly because nothing #includes it, so the dependency finder
; would not pick it up on its own.
lib_deps =
    mincrmatt12/STM32Cube Middleware-FreeRTOS
    freertos_port_patch
custom_freertos_config_location = include/FreeRTOSConfig.h
; The FreeRTOS library leaves optional kernel files out of the build unless
; they are listed here; event_groups.c provides xSystemEvents.
custom_freertos_features = event_groups

; Host-side unit tests for the hardware-independent logic (no HAL/FreeRTOS).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<*_logic.cpp>
; Windows has no host gcc by default; use PlatformIO's MinGW toolchain package,
; which the script puts on PATH (the native platform does not do that itself).
platform_packages = platformio/toolchain-gccmingw32
extra_scripts = pre:scripts/native_toolchain.py
